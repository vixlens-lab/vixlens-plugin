name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Tokens em sync + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Guarda de drift de token (CSS/preset batem com o JSON?)
        run: npm run tokens:check

      - name: Build
        run: npm run build
